<rect x="250" y="865" width="1000" height="50" fill="black"/>
<text x="268" y="890" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white" dominant-baseline="middle">4. TESTING</text>
<text x="270" y="933" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">Unit, integration, and system tests</text>
<text x="270" y="961" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">Household and non-household UAT</text>
