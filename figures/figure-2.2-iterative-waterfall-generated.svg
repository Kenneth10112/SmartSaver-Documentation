<text x="750.0" y="1400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" font-style="italic" text-anchor="middle" fill="black" dominant-baseline="hanging">Each pass through testing may return to requirements, design, or implementation. Deployment starts the next increment.</text>
