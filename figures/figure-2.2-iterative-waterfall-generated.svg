<text x="750.0" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" font-style="italic" text-anchor="middle" fill="black" dominant-baseline="hanging">Structured phases with feedback from testing and a next-increment loop from deployment</text>
