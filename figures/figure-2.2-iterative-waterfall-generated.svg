<rect x="250" y="145" width="1000" height="50" fill="black"/>
<text x="268" y="170" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white" dominant-baseline="middle">1. REQUIREMENTS ANALYSIS</text>
<text x="270" y="213" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">Scope, users, and data requirements</text>
<text x="270" y="241" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">Functional and non-functional requirements</text>
