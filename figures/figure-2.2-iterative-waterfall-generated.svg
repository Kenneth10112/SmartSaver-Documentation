<text x="270" y="693" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">Hub firmware and ESP32-C3 modules</text>
<text x="270" y="721" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">Dashboard, local storage, and pairing</text>
<text x="270" y="749" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="black" dominant-baseline="hanging">History Server design</text>
